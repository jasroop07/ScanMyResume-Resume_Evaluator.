<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScanMyResume📝</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Blurred background -->
    <div class="background-blur"></div>

    <!-- Topbar with logo only -->
    <div class="topbar">
        <div class="left-section">
            <img src="{{ url_for('static', filename='resume_logo.png') }}" alt="Logo" class="logo-img">
        </div>
        <div class="tagline">Smart resume analysis for every job seeker</div>
    </div>

    <!-- Form container -->
    <div class="container">
        <form action="{{ url_for('process_resume') }}" method="POST" enctype="multipart/form-data">
            <div style="text-align: center; font-size: 2.5rem; margin-bottom: 1rem;">📄</div>

            <label for="resume">Upload Resume (PDF format only)</label>
            <input type="file" id="resume" name="resume" accept=".pdf" required>

            <label for="job_description">Job Description</label>
            <textarea id="job_description" name="job_description" placeholder="Paste the job description here..." required></textarea>

            <button class="button-86" type="submit"><span class="text">Scan Resume</span></button>
        </form>
        <footer>&copy; 2025 ScanMyResume. All rights reserved.</footer>
    </div>
</body>
</html>
